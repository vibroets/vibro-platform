name: Vibro QA CI/CD

on:
  push:
    branches:
      - QA-be

env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  DB_DATABASE: ${{ secrets.DB_DATABASE }}
  DB_USERNAME: ${{ secrets.DB_USERNAME }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  DB_HOST: ${{ secrets.DB_HOST }}
  DB_PORT: ${{ secrets.DB_PORT }}
  PORT: ${{ secrets.PORT }}
  EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
  EMAIL_FROM_ADDRESS: ${{ secrets.EMAIL_FROM_ADDRESS }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  FORMS_UPLOAD_BUCKET: ${{ secrets.FORMS_UPLOAD_BUCKET }}
  ANNOUNCEMENTS_UPLOAD_BUCKET: ${{ secrets.ANNOUNCEMENTS_UPLOAD_BUCKET }}
  FORMS_DRAFT_BUCKET: ${{ secrets.FORMS_DRAFT_BUCKET }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.DOCKER_HUB_USERNAME }}/vibro-server:qa

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Set up SSH key
        run: |
          echo "${{ env.SSH_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Deploy to QA EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${{ env.EC2_USERNAME }}@${{ env.EC2_HOST }} << 'EOF'
            sudo systemctl start docker
            sudo docker stop vibro-server-qa || true
            sudo docker rm vibro-server-qa || true
            sudo docker rmi ${{ env.DOCKER_HUB_USERNAME }}/vibro-server:qa || true
            sudo docker pull ${{ env.DOCKER_HUB_USERNAME }}/vibro-server:qa
            sudo docker run -d --name vibro-server-qa -p 8001:8000 \
              -e NODE_ENV=qa \
              -e DB_DATABASE="${{ env.DB_DATABASE }}" \
              -e DB_USERNAME="${{ env.DB_USERNAME }}" \
              -e DB_PASSWORD="${{ env.DB_PASSWORD }}" \
              -e DB_HOST="${{ env.DB_HOST }}" \
              -e DB_PORT="${{ env.DB_PORT }}" \
              -e PORT="${{ env.PORT }}" \
              -e EMAIL_HOST_PASSWORD="${{ env.EMAIL_HOST_PASSWORD }}" \
              -e AWS_REGION="${{ env.AWS_REGION }}" \
              -e FORMS_UPLOAD_BUCKET="${{ env.FORMS_UPLOAD_BUCKET }}" \
              -e ANNOUNCEMENTS_UPLOAD_BUCKET="${{ env.ANNOUNCEMENTS_UPLOAD_BUCKET }}" \
              -e FORMS_DRAFT_BUCKET="${{ env.FORMS_DRAFT_BUCKET }}" \
              -e AWS_ACCESS_KEY_ID="${{ env.AWS_ACCESS_KEY_ID }}" \
              -e AWS_SECRET_ACCESS_KEY="${{ env.AWS_SECRET_ACCESS_KEY }}" \
              ${{ env.DOCKER_HUB_USERNAME }}/vibro-server:qa
          EOF

      - name: Clean up SSH Key
        run: rm -f private_key.pem
