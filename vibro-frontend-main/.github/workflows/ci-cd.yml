name: Vibro CI/CD

on:
  push:
    branches:
      - QA-fe

env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.DOCKER_HUB_USERNAME }}/vibro-frontend:QA
          cache-from: type=registry,ref=${{ env.DOCKER_HUB_USERNAME }}/vibro-frontend:QA
          cache-to: type=inline

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${{ env.EC2_USERNAME }}@${{ env.EC2_HOST }} << 'EOF'
            set -e

            echo "🔹 Ensuring Docker is running..."
            sudo systemctl start docker || true

            echo "🔹 Stopping and removing existing container..."
            sudo docker stop vibro-frontend || true
            sudo docker rm vibro-frontend || true

            echo "🔹 Pulling latest image..."
            sudo docker pull ${{ env.DOCKER_HUB_USERNAME }}/vibro-frontend:QA

            echo "🔹 Running updated container..."
            sudo docker run -d \
              --name vibro-frontend \
              --restart always \
              --pull always \
              -p 3000:3000 \
              -e NODE_ENV=production \
              ${{ env.DOCKER_HUB_USERNAME }}/vibro-frontend:QA

            echo "✅ Deployment successful!"
          EOF

      - name: Clean up SSH Key
        run: rm -f private_key.pem
