name: Vibro Frontend CI/CD

on:
  push:
    branches:
      - prod-frontend-aws   # Triggers when you push to the main branch

  # Optional: allow manual trigger from GitHub Actions UI
  workflow_dispatch:

env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
  EC2_HOST: ${{ secrets.PROD_EC2_HOST }}
  EC2_USERNAME: ${{ secrets.PROD_EC2_USERNAME }}
  SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

jobs:
  build-and-push:
    name: 🐳 Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout Code
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_ACCESS_TOKEN }}

      - name: 🏗️ Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.DOCKER_HUB_USERNAME }}/vibro-frontend:latest
          cache-from: type=registry,ref=${{ env.DOCKER_HUB_USERNAME }}/vibro-frontend:latest
          cache-to: type=inline

  deploy:
    name: 🚀 Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: 🧩 Checkout Code
        uses: actions/checkout@v4

      - name: 🔑 Set up SSH Key
        run: |
          echo "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: 🚀 Deploy Frontend Container
        run: |
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${{ env.EC2_USERNAME }}@${{ env.EC2_HOST }} << 'EOF'
            set -e

            echo "🔹 Ensuring Docker is running..."
            sudo systemctl start docker || true

            echo "🔹 Stopping and removing existing container..."
            sudo docker stop vibro-frontend || true
            sudo docker rm vibro-frontend || true

            echo "🔹 Pulling latest image..."
            sudo docker pull ${{ env.DOCKER_HUB_USERNAME }}/vibro-frontend:latest

            echo "🔹 Running updated container..."
            sudo docker run -d \
              --name vibro-frontend \
              --restart always \
              -p 3000:3000 \
              -e NODE_ENV=production \
              ${{ env.DOCKER_HUB_USERNAME }}/vibro-frontend:latest

            echo "✅ Frontend deployed successfully!"
          EOF

      - name: 🧹 Clean up SSH Key
        run: rm -f private_key.pem
